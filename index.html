<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101021">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    [hidden]{display:none!important}
    #startup{position:fixed;inset:0;z-index:1000;background:#101426;color:#f4e5c5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font:16px Menlo,Consolas,monospace;line-height:1.6}
    #startup h1{font-size:26px;color:#ffbc61}#startup button{padding:14px 24px;color:#fff0cc;background:#34354d;border:2px solid #797089;border-radius:8px;font:16px Menlo,Consolas,monospace;cursor:pointer}
    #touch-controls,#rotate-hint{display:none}
  </style>
  <title>Гарбузик: Останній Гелловін</title>
</head>
<body>
  <section id="startup" role="status"><h1>ГАРБУЗИК</h1><p id="startup-message">Запалюємо гелловінський ліхтар…</p><button id="retry-load" hidden>ЩЕ РАЗ</button></section>
  <noscript>Для гри потрібен JavaScript. Увімкни його в браузері та онови сторінку.</noscript>
  <div id="game"></div>
  <nav id="touch-controls" aria-label="Керування грою">
    <div class="control-group">
      <button data-control="left" aria-label="Ліворуч">◀</button>
      <button data-control="right" aria-label="Праворуч">▶</button>
    </div>
    <div class="control-group utilities">
      <button data-control="pause">ПАУЗА</button>
      <button data-control="mute">ЗВУК</button>
    </div>
    <div class="control-group actions">
      <button data-control="scare">БУ!</button>
      <button data-control="fire">ВОГОНЬ</button>
      <button data-control="jump" class="jump">СТРИБОК</button>
    </div>
    <button id="comic-continue" hidden>ТОРКНИСЬ, ЩОБ ПРОДОВЖИТИ</button>
  </nav>
  <nav id="screen-actions" aria-label="Дії на екрані" hidden></nav>
  <div id="rotate-hint"><span>↻</span><strong>Поверни телефон горизонтально</strong><p>Гарбузик любить широкий екран.<br>Твоя пригода зачекає.</p></div>
  <script>
    (() => {
      let ready = false;
      const panel = document.getElementById('startup');
      const retry = document.getElementById('retry-load');
      const fail = () => {
        if (ready) return;
        document.getElementById('startup-message').textContent = 'Не вдалося завантажити гру. Перевір з’єднання та спробуй ще раз.';
        retry.hidden = false;
      };
      const timeout = setTimeout(fail, 20000);
      document.addEventListener('game-ready', () => { ready = true; clearTimeout(timeout); panel.hidden = true; }, { once: true });
      window.addEventListener('error', fail, true);
      window.addEventListener('unhandledrejection', fail);
      retry.addEventListener('click', () => location.reload());
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
